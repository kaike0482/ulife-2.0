version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ulife-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: ulife
      MYSQL_USER: ulife_user
      MYSQL_PASSWORD: ulife123
    ports:
      - "3306:3306"
    volumes:
      - ulife_data:/var/lib/mysql

volumes:
  ulife_data:
